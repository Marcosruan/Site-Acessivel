services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: site-acessivel-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
    stdin_open: true
    tty: true
